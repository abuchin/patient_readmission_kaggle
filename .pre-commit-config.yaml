# Pre-commit hooks for code quality and consistency
# Install with: pre-commit install
# Run manually with: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(.*\.md|.*\.rst)$
      - id: end-of-file-fixer
        exclude: ^(.*\.md|.*\.rst)$
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.12
        exclude: ^(patient_env/|venv/|env/|\.venv/|migrations/)

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        exclude: ^(patient_env/|venv/|env/|\.venv/|migrations/)

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [
          "--max-line-length=88", 
          "--extend-ignore=E203,W503",
          "--exclude=patient_env,venv,env,.venv,migrations"
        ]
        additional_dependencies: [
          flake8-docstrings,
          flake8-bugbear,
          flake8-comprehensions,
          flake8-simplify
        ]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [
          "-r", ".", 
          "-x", "patient_env,venv,env,.venv,tests,migrations",
          "-f", "custom"
        ]
        exclude: ^(tests/|patient_env/|venv/|env/|\.venv/)

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [
          types-requests,
          types-PyYAML,
          types-python-dateutil
        ]
        exclude: ^(patient_env/|venv/|env/|\.venv/|tests/|migrations/)

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: ["--ignore", "DL3008", "--ignore", "DL3009"]

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types: [yaml]
        exclude: ^(.*\.yml\.j2|.*\.yaml\.j2)$

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # Jupyter notebook cleaning
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.7.1
    hooks:
      - id: nbqa-black
        additional_dependencies: [black==23.12.1]
      - id: nbqa-isort
        additional_dependencies: [isort==5.13.2]
        args: ["--profile=black"]

  # Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(patient_env/|venv/|env/|\.venv/|\.git/)

  # Airflow DAG validation
  - repo: local
    hooks:
      - id: airflow-dag-check
        name: Airflow DAG Check
        entry: bash -c 'if [ -d "astro-airflow/dags" ]; then for dag in astro-airflow/dags/*.py; do python -m py_compile "$dag" || exit 1; done; fi'
        language: system
        files: ^astro-airflow/dags/.*\.py$
        pass_filenames: false

  # MLflow model validation
  - repo: local
    hooks:
      - id: mlflow-validate
        name: MLflow Model Validation
        entry: bash -c 'if [ -f "RAY/ray_tune_xgboost.py" ]; then python -m py_compile RAY/ray_tune_xgboost.py; fi'
        language: system
        files: ^(RAY|DEPLOY|MONITOR)/.*\.py$
        pass_filenames: false

  # Docker image security scan (if enabled)
  - repo: local
    hooks:
      - id: docker-security-scan
        name: Docker Security Scan
        entry: bash -c 'if command -v trivy >/dev/null 2>&1; then trivy fs --exit-code 1 --severity HIGH,CRITICAL .; else echo "Trivy not installed, skipping security scan"; fi'
        language: system
        files: ^Dockerfile.*$
        pass_filenames: false

# Configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [
    docker-security-scan,  # Skip in CI as it requires Docker
    hadolint-docker        # Skip in CI if Docker not available
  ]
  submodules: false